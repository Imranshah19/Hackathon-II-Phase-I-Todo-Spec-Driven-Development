[project]
name = "console-todo-app"
version = "0.1.0"
description = "In-Memory Console Todo Application - Phase I of Multi-Phase Todo Project"
requires-python = ">=3.13"
readme = "specs/001-console-todo-app/quickstart.md"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true

[project.scripts]
todo = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.pyright]
pythonVersion = "3.13"
include = ["src", "tests"]
